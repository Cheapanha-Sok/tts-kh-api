.deploy:
  services: 
    - docker:24.0.5-dind
  before_script:
    - apk add --no-cache sshpass openssh-client

  script:
    - |
      sshpass -p "${host_password}" ssh -p "${host_port}" -o StrictHostKeyChecking=no \
        "${host_username}@${host_ip}" "bash -c '

          cd /home/${host_username}/${base_image_name} || exit 1

          export registry="${registry}"
          export repo="${repo}"
          export base_image_name="${base_image_name}"
          export env="${env}"

          echo "======> Stop and remove existing container, image..."
          docker compose down -v || true
          docker rmi "${registry}/${repo}/${base_image_name}:${env}-latest" || true

          echo "======> Pulling new image..."
          docker pull "${registry}/${repo}/${base_image_name}:${env}-latest"

          echo "======> Restarting containers..."
          docker compose up -d
        '"