# Build Docker image
.build:
  services:
    - docker:24.0.5-dind

  before_script:
    - echo "${registry_password}" | docker login "${registry}" -u "${registry_user}" --password-stdin

  script:
      - |
        echo "======> Downloading ONNX TTS model from model registry with project: ${CI_PROJECT_ID}..."
        
        # CHANGED: Updated the URL to end in 'kh.onnx' (matches registry)
        # CHANGED: kept -O tts.onnx so the file is renamed upon download to what your Dockerfile expects
        wget --header="JOB-TOKEN: ${CI_JOB_TOKEN}" \
            -O tts.onnx \
            "https://gitlab.igtech.asia/api/v4/projects/${CI_PROJECT_ID}/packages/generic/kh-onnx-tts/1.0.0/kh.onnx"

        # REMOVED: The unzip steps were removed because kh.onnx is a file, not a zip.

        echo "======> Building Docker image..."
        docker build -t "${base_image_name}" --build-arg MODEL_FILE=tts.onnx .

        echo "======> Tagging built image..."
        docker tag "${base_image_name}" "${registry}/${repo}/${base_image_name}:${env}-latest"

        echo "======> Pushing image to registry ${registry}..."
        docker push "${registry}/${repo}/${base_image_name}:${env}-latest"