# Build Docker image
.build:
  services:
    - docker:24.0.5-dind

  before_script:
    - echo "${registry_password}" | docker login "${registry}" -u "${registry_user}" --password-stdin

  script:
    - |

      echo "======> Downloading ONNX TTS model from model registry..."
      wget \
      --header="JOB-TOKEN: ${CI_JOB_TOKEN}" \
      "https://gitlab.igtech.asia/ig/si/tdc/sound-ai/sound-ai-khmer/-/ml/models/kh-onnx-tts/versions/1.0.0/artifacts/download" \
      -O tts.zip

      echo "======> Unzipping the model..."
      unzip tts.zip
      mv artifacts/*.onnx tts.onnx

      echo "======> Building Docker image..."
      docker build -t "${base_image_name}" --build-arg MODEL_FILE=tts.onnx .

      echo "======> Tagging built image..."
      docker tag "${base_image_name}" "${registry}/${repo}/${base_image_name}:${env}-latest"

      echo "======> Pushing image to registry ${registry}..."
      docker push "${registry}/${repo}/${base_image_name}:${env}-latest"