.write:
  before_script:
    - apk add --no-cache sshpass openssh-client

  script:
    - |
      echo "======> Ensuring remote directory exists: /home/${host_username}/${base_image_name}/"
      sshpass -p "${host_password}" ssh -p "${host_port}" -o StrictHostKeyChecking=no \
        "${host_username}@${host_ip}" "mkdir -p /home/${host_username}/${base_image_name}/"

      echo "======> Copying docker-compose.yml and nginx.conf to remote server: ${host_ip}"
      sshpass -p "${host_password}" scp -P "${host_port}" -o StrictHostKeyChecking=no \
        docker-compose.yml nginx.conf \
        "${host_username}@${host_ip}:/home/${host_username}/${base_image_name}/"

      echo "======> Verifying files are on remote server"
      sshpass -p "${host_password}" ssh -p "${host_port}" -o StrictHostKeyChecking=no \
        "${host_username}@${host_ip}" "ls -l /home/${host_username}/${base_image_name}/"
