services:
  app:
    image: ${registry:-local}/${repo:-sound-ai-khmer}/${base_image_name:-sound-ai-khmer}:${env:-development}-latest
    build:
      context: .
      args:
        MODEL_FILE: ${MODEL_FILE:-tts.onnx}
    container_name: ${base_image_name:-sound-ai-khmer}
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ENVIRONMENT: ${env:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tts_en_network

  redis:
    image: redis:7-alpine
    container_name: redis_${base_image_name:-sound-ai-khmer}
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tts_en_network

networks:
  tts_en_network:
    driver: bridge
